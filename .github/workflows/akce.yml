name: akce
# kuponmat.cz/akce — promo prices from leaflet PDFs + chain websites (no AI), static pages, FTP deploy.
#   03:10 Prague  full run (all sources, crops, history)
#   07:40 Prague  light run (new Wednesday/Thursday leaflets appear in the morning)
#   manual quick=true: no download, rebuild HTML from the last data and upload the changes (fast path for fixes)
on:
  schedule:
    - cron: "10 2 * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick rebuild (no download, templates/CSS only)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: akce
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Data branch (offers, history, crops) -> ../data
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" ../data \
            || (mkdir -p ../data && cd ../data && git init -q -b data)
          mkdir -p ../data/offers ../data/img
          rm -rf data && ln -s ../data data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Browser for the Kaufland leaflet adapter
        if: ${{ !inputs.quick }}
        run: |
          npm i --no-save --silent puppeteer-core@23.11.1
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Site shell (header/footer of kuponmat.cz)
        run: |
          mkdir -p cache
          curl -sf --retry 3 -A "Mozilla/5.0 (compatible; KuponmatAkce/1.0)" https://kuponmat.cz/letaky/ -o cache/shell.html \
            || curl -sf --retry 3 --resolve kuponmat.cz:443:89.221.213.39 -A "Mozilla/5.0 (compatible; KuponmatAkce/1.0)" https://kuponmat.cz/letaky/ -o cache/shell.html
          grep -q "</main>" cache/shell.html
      - name: Collect offers
        if: ${{ !inputs.quick }}
        run: python -m akce.collect --crops data/img
      - name: Build
        run: |
          python -m akce.build ${{ inputs.quick && '--no-history' || '' }}
          mkdir -p dist/akce/img
          # crops of offers that are still valid (the data branch keeps them between runs)
          python -m tools.keep_crops data dist/akce/img
      - name: Health check (empty result must not replace the live site)
        run: python -m tools.health dist
      - name: Save data
        if: ${{ !inputs.quick }}
        run: |
          python tools/prune_data.py ../data
          cd ../data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "data $(date -u +%F-%H%M)" || true
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
      - name: Deploy (FTP, changed files only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_ROOT: /domains/kuponmat.cz
        run: python -m tools.deploy
      - name: Cloudflare purge + IndexNow
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python -m tools.after_deploy dist/changed-urls.txt
